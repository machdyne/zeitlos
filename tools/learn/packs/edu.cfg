# edu: learn's courses from the Ark (edu/ in github.com/machdyne/ark,
# its curriculum map edu/curriculum.md). Built from the ark checkout
# tools/ask keeps (tools/ask/.cache/ark, or $ASK_CACHE/ark):
#   ./tools/learn/pack.py build --update tools/learn/packs/edu.cfg
# and shipped as the `edu` set (release/lib/mkfatimg.py): `update -s edu`
# adds it to a card. On the card: /opt/ark/edu/, where learn's
# catalogue finds it.

name        = edu
version     = 1
description = Courses from the Ark: school, college, languages and life
repo        = ark https://github.com/machdyne/ark
source      = @ark/edu
course      = math-3
# the release rules (a reviewer for every course): on once the courses are reviewed
release     = no
