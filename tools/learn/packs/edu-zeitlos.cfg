# edu-zeitlos: courses about Zeitlos itself, built from this tree.
#
# Its own pack, apart from the Ark's edu packs, because it moves with
# the system: a course that teaches the keys, the apps and learn has to
# change in the release that changes them. Built in a second by
#   ./tools/learn/pack.py build tools/learn/packs/edu-zeitlos.cfg
# and shipped with the base set (release/lib/mkfatimg.py, PACK_SET).
#
# `course` names what goes in, in no particular order (the catalogue
# sorts); none means every course in `source`. A release can carry some
# or all of them.

name        = edu-zeitlos
version     = 1
description = Courses about Zeitlos: using it, timeless computing, and learn itself
source      = ../../../sw/data/learn/edu-zeitlos
course      = zeit-learn
course      = zeit-start
course      = zeit-tc
course      = zeit-write
course      = zeit-sheet
course      = zeit-make
course      = zeit-keep
course      = zeit-net
course      = zeit-basic
course      = zeit-scheme
course      = zeit-c
course      = zeit-inside
course      = zeit-hw
course      = zeit-fpga
# the release rules (a reviewer for every course): on once the pack is reviewed
release     = no
