# tools/zconfig/catalog.cfg -- what the configurator offers, and what
# each piece costs (docs/zconfig.md).
#
# One section a component. Keys:
#
#   menu      the menu it is in
#   title     its name in the menu
#   define    the define that builds it (rtl/boards.vh)
#   off       for a universal define (one rtl/boards.vh sets for every
#             board: RTC, TRNG, MPU...), the NO_ flag that removes it
#   choice    a group of which exactly one is chosen; a member without a
#             define is the "none" (or the default) of its group
#   values    for a define that takes a value: the values offered
#   lut       LUTs (ECP5 TRELLIS_COMB, as a release build packs them)
#   bram      block RAMs (DP16KD)
#   dsp       multipliers (MULT18X18D)
#   lut.V, bram.V, dsp.V   the same for value V of a `values` define
#   lut_with.D, bram_with.D   more when define D is there too (VRAM_SDRAM
#             and T2: T2's write queue)
#   requires  defines that must also be there (all of them)
#   needs_any defines of which at least one must be there
#   conflicts defines that must not be there
#   pins      yes: needs the board's pins, so it can be left out, but
#             only added where the board (or a PMOD) has them
#   families  FPGA families it exists on (default: all)
#   help      one or two lines
#
# The numbers are ESTIMATES for ECP5: per-block synthesis
# (tools/zconfig/measure.py --modules, yosys 0.70) times 0.78, which is
# what sergei_ml2 and sergei_ml2_console pack to as whole builds
# (33,043 and 30,444 TRELLIS_COMB; their blocks alone 41,800 and 39,900). A sum of parts is
# within about 10% of a real build; the configurator's Measure runs the
# real one. Update them here as builds are measured.
#
# `core` is what every build has: the bus, sysctl's decoding and glue,
# the boot ROM, the CSRs, the SPI flash, the UART and the MTU.

[core]
menu = -
title = the SoC itself
bram = 5
help = bus, address decoding, boot ROM, CSRs, SPI flash, UART, MTU
lut = 2680

# -- profile ------------------------------------------------------------
[profile_desktop]
menu = Profile
choice = profile
title = Desktop
help = everyday work, learning, programming and games (docs/profiles.md)

[profile_console]
menu = Profile
choice = profile
title = Console
define = ZEITLOS_CONSOLE
help = games, demos and 3D: the launcher in game mode, no desktop

[profile_headless]
menu = Profile
choice = profile
title = Headless
define = ZEITLOS_HEADLESS
help = servers, BBSes and controllers (defined, not yet acted on)

# -- CPU and caches -------------------------------------------------------

[cpu_picorv32]
menu = CPU and caches
choice = cpu
title = picorv32
bram = 2
help = the default core; about 0.14-0.3 instructions a cycle
lut = 2500

[cpu_zeitlos32]
menu = CPU and caches
choice = cpu
title = zeitlos32 (experimental)
define = CPU_ZEITLOS32
help = zeitlos32, three-stage (docs/zeitlos32.md)
lut = 2570
bram = 0

[cpu_zeitlos32p]
menu = CPU and caches
choice = cpu
title = zeitlos32p (pipelined)
define = CPU_ZEITLOS32P
requires = DCACHE ARBITER
help = pipelined, with a branch predictor and the split cache: about 0.65 IPC on Doom (docs/zeitlos32p.md)
lut = 4840
bram = 0

[mul_fast]
menu = CPU and caches
title = fast multiply (DSP)
define = CPU_MUL_FAST
off = NO_CPU_MUL_FAST
dsp = 4
help = multiplies in the DSP blocks; without it a slower shift-and-add multiplier
lut = 120
bram = 0

[regs_lutram]
menu = CPU and caches
title = picorv32 registers in LUT RAM
define = PICORV32_REGS_LUTRAM
lut = 100
bram = -2
conflicts = CPU_ZEITLOS32 CPU_ZEITLOS32P
help = frees the register file's block RAM, for a few LUTs

[icache]
menu = CPU and caches
title = instruction cache
define = ICACHE
help = needed for code in SDRAM/DDR3 to run at speed
lut = 700

[icache_kb]
menu = CPU and caches
title = instruction cache size (KB)
define = ICACHE_KB
values = 4 8
bram.4 = 3
bram.8 = 5
requires = ICACHE

[dcache]
menu = CPU and caches
title = data cache
define = DCACHE
bram = 3
requires = ICACHE
help = write-through data cache (docs/dcache.md)
lut = 700

[dcache_kb]
menu = CPU and caches
title = data cache size (KB)
define = DCACHE_KB
values = 2 4 8
bram.2 = 0
bram.4 = 0
bram.8 = 2
requires = DCACHE

[mpu]
menu = CPU and caches
title = MPU (memory protection)
define = MPU
off = NO_MPU
help = keeps programs out of each other's memory and the kernel's
lut = 620

# -- graphics -------------------------------------------------------------
[gpu]
menu = Graphics
title = video
define = GPU
bram = 2
pins = yes
help = the display: 640x480 monochrome desktop, game mode
lut = 860

[ddmi]
menu = Graphics
title = DVI/HDMI output (DDMI)
define = GPU_DDMI
pins = yes
requires = GPU
lut = 620

[ddmi_audio]
menu = Graphics
title = Sound over DVI/HDMI (DDMI audio)
define = GPU_DDMI_AUDIO
off = NO_DDMI_AUDIO
requires = GPU_DDMI
lut = 930
help = audio as HDMI data islands (docs/ddmi_audio.md); on by default in the console profile

[vga]
menu = Graphics
title = VGA output
define = GPU_VGA
lut = 60
pins = yes
requires = GPU

[blit]
menu = Graphics
title = blitter
define = GPU_BLIT
requires = GPU
help = copies, fills, glyphs and patterns in VRAM; the 2D accelerator
lut = 3350
dsp = 1

[raster]
menu = Graphics
title = line rasterizer
define = GPU_RASTER
requires = GPU
help = draws lines in hardware; zgfx draws them in software without it
lut = 560

[cursor]
menu = Graphics
title = hardware pointer
define = GPU_CURSOR
requires = GPU
help = the desktop's mouse pointer, drawn by the video
lut = 160

[vram]
menu = Graphics
title = VRAM
define = MEM_VRAM
rule = vram
help = the desktop and the game-mode planes; block RAMs worked out from the planes and the profile
lut = 180

[glyph]
menu = Graphics
title = glyph memory
define = MEM_GLYPH
bram = 2
help = the blitter's font memory (text on screen)
lut = 120

[color]
menu = Graphics
title = colour (game-mode planes)
define = COLOR
requires = GPU
help = game mode in colour, 2 to 8 planes (docs/color.md)
lut = 270

[game_planes]
menu = Graphics
title = game-mode planes
define = GAME_PLANES
values = 2 4 6 8
lut.8 = 100
requires = COLOR
help = 2^planes colours in game mode; VRAM is 5 block RAMs a plane (the desktop's 640x480 is four)

[chunky]
menu = Graphics
title = chunky game mode (256 colours, a byte a pixel)
define = GAME_CHUNKY
lut = 70
requires = COLOR
help = needs 8 planes of VRAM, or the picture in main memory (VRAM_SDRAM)

[color_window]
menu = Graphics
title = colour windows on the desktop
define = COLOR_WINDOW
requires = COLOR
help = a window in colour on the monochrome desktop
lut = 160

[color_desktop]
menu = Graphics
title = desktop colour themes
define = COLOR_DESKTOP
requires = COLOR
lut = 120

[vram_sdram]
menu = Graphics
title = chunky picture in main memory (VRAM_SDRAM)
define = VRAM_SDRAM
bram = 1
bram_with.GPU_T2 = 3
requires = GAME_CHUNKY
help = the 256-colour picture in SDRAM/DDR3 instead of VRAM: the console's way on small FPGAs
lut = 580

# -- 3D -----------------------------------------------------------------
[t2]
menu = 3D
title = T2 triangle engine
define = GPU_T2
bram = 30
dsp = 5
requires = GPU GAME_CHUNKY
help = runs the whole 3D frame: geometry core, raster, depth (docs/zgl_t2.md)
lut = 4600

[t2_tex]
menu = 3D
title = T2 textures (texture memory, log2 texels)
define = T2_TEX_LOG2
values = 0 13
lut.13 = 1600
bram.13 = 9
dsp.13 = 2
requires = GPU_T2
help = 13: an 8 KB texture memory, perspective-correct

[t2_strip]
menu = 3D
title = T2 strip height (rows)
define = T2_STRIP_H
values = 6 12
bram.6 = -3
requires = GPU_T2
help = 6 saves three block RAMs (the console on Lakritz)

# the three together, synthesised (gpu_t2_wb alone, textures, LINEAR):
# 42 -> 58 DP16KD, 5,833 -> 6,065 LUT4; split between them by estimate
[t2_lists]
menu = 3D
title = T2 two record lists (geometry and raster overlap)
define = T2_TWO_LISTS
values = 0 1
lut.1 = 100
bram.1 = 9
requires = GPU_T2
help = the next frame's records made while this one is drawn: a frame takes the longer of the two, not their sum

[t2_bufs]
menu = 3D
title = T2 two strip buffers
define = T2_TWO_BUFS
values = 0 1
lut.1 = 120
bram.1 = 7
requires = GPU_T2
help = one strip drawn while the last goes out

[t2_rowend]
menu = 3D
title = T2 rows end past a triangle's span
define = T2_ROW_END
values = 0 1
lut.1 = 12
requires = GPU_T2
help = a row of a triangle stops at its span, not its bounding box

[ckfetch_lines]
menu = 3D
title = Scanout line fetch, lines ahead
define = CKFETCH_LINES
values = 2 4
lut.4 = 120
requires = VRAM_SDRAM
help = 4: a fetch late by up to two lines catches up (a busy bus); no more block RAM

