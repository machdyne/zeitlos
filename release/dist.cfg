# The distribution this tree builds by default (docs/distribution.md).
#
# Public facts only: a name for people, where boards fetch updates from,
# and the Ed25519 public keys whose signatures they accept. Committed.
# The private key and where `zrelease ship` uploads to are NOT here:
# they live on the release machine, in ~/.zeitlos/ (or $ZEITLOS_HOME).
#
# A fork that publishes its own updates changes these three and runs
# `zrelease keygen --add` on its release machine. Changing this file
# changes what `update` is built with (sw/apps/update/zdist.h, made from
# it: `make -C sw/apps/update dist`).
#
# More than one `key` line: boards accept a release signed by any of
# them, which is how a key is replaced without stranding boards that
# have the old one (docs/distribution.md, "Changing the key").

name = Machdyne Zeitlos
url = http://zeitlos.machdyne.com/release/
key = c85f231c9d6facce83a5617dc5285e6850aed64e7c52f5b0b4be528d78ff4cf6
