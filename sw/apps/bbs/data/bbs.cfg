# bbs.cfg -- the BBS's own settings (docs/bbs.md, "Configuration").
# The same file on a Zeitlos card (/bbs/bbs.cfg) and on a Linux server.
# Every key is optional; these are the defaults, except the name.

name: Zeitlos BBS          # shown on every screen
sysop:                     # your handle, shown on the welcome screen
nodes: 4                   # callers at once, 1-16 (each ~5KB on Zeitlos)
new_users: yes             # may callers make their own accounts
idle_minutes: 15           # logged in and silent this long: goodbye
login_seconds: 120         # to get logged in
pw_iterations: 2000        # hashing new passwords: fine on Linux; on a Zeitlos
                           # board use 200 (0.4 s -- 2000 takes 4.3 s and freezes
                           # every caller meanwhile). docs/bbs.md, "Passwords"
new_level: 10              # a new account's level (255 is sysop)
