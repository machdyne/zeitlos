# /data/bbs/bbs.cfg as the release card ships it: bbs.cfg with a board's
# values (sw/apps/bbs/data/bbs-board.cfg; release/lib/mkfatimg.py).

# bbs.cfg -- the BBS's own settings (docs/bbs.md, "Configuration").
# The same keys as on a Linux server.
# Every key is optional; these are the defaults, except the name and
# pw_iterations.

name: Zeitlos BBS          # shown on every screen
sysop:                     # your handle, shown on the welcome screen
nodes: 4                   # callers at once, 1-16 (each ~5KB on Zeitlos)
new_users: yes             # may callers make their own accounts
idle_minutes: 15           # logged in and silent this long: goodbye
login_seconds: 120         # to get logged in
pw_iterations: 200         # hashing new passwords: 0.4 s a login on a board --
                           # 2000 would take 4.3 s and freeze every caller
                           # meanwhile. docs/bbs.md, "Passwords"
new_level: 10              # a new account's level (255 is sysop)

# Federation (docs/bbs.md, "Federation"): once fed is configured
# (/data/fed/fed.cfg), this line connects the BBS to it. REQUIRED for any
# forum with a topic in forums.cfg -- without it those forums stay on
# this BBS.
# fed: fed0
