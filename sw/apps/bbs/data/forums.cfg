# forums.cfg -- the forums (docs/bbs.md, "Forums").
# tag; name; level to read; level to write; description; topic
#
# The topic, optional, carries the forum over zfed (docs/bbs.md,
# "Federation"): NETWORK/forum/TAG, the same on every BBS that carries
# it -- general; General; 0; 10; Anything at all; mynet/forum/general.
# It needs bbs.cfg's fed: line too. Without either, the forum stays on
# this BBS.
# A tag is the forum's identity (its files, later its name on the
# network): a-z 0-9 - _, at most 16. Rename and reorder freely; never
# reuse a tag for something else. "mail" is taken.
general; General; 0; 10; Anything at all
zeitlos; Zeitlos; 0; 10; The computer, the OS, the apps
announce; News; 0; 255; From the sysop
