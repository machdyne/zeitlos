# fed.cfg -- this node's zfed configuration. docs/fed.md, "Configuration".
#
# As shipped, fed runs alone: no network, no peers. To join a network:
#
#   1. `run fed key` prints this node's PUBLIC key (safe to share). Send
#      it to the network's publisher, who adds it (`fed add NAME KEY`).
#   2. Fill in the three lines below from what they tell you, and
#      restart fed.
#   3. For the BBS: BOTH `fed: fed0` in /data/bbs/bbs.cfg and the network's
#      topics in /data/bbs/forums.cfg; then restart the BBS. Its log says
#      `fed: connected`.
#
# The node's PRIVATE key is in the flash key/value store, never here.

name: mynode                  # a-z 0-9 -, as the network's list will name it
poll_seconds: 300             # how often it calls its peers

# network: NETWORK PUBLISHER-PUBLIC-KEY
# peer: PUBLISHER-PUBLIC-KEY HOST:9070
# subscribe: NETWORK/*
