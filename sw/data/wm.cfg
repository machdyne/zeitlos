# wm.cfg -- the dock (docs/dock.md)
#
# This is the built-in copy, in flash at /data/wm/wm.cfg. To change the
# dock, save your own copy at the same path on the card: it replaces
# this one whole (nothing of this file is kept), and `cfg reload`
# applies it. Delete it to come back to this one.
#
# A name is an app's file name (in /apps or in flash). An app that is
# not installed, or needs hardware this board does not have, is left
# out, and so is a group left with no apps. @id is a group's icon: a
# click opens the group in place of the row, with BACK at its start.
# @rest is every app with an icon that the row and its groups do not
# name, in name order. A row (or a group) longer than the dock pages,
# with NEXT at the end.
#
# A line that starts with a space or a tab continues the line above.

# Which edge of the screen the dock is on: bottom, top, left or right.
# Along the bottom or the top it shows `row wide`, on the left or the
# right `row tall` (or `row wide`, paging, in a file with no `tall`).
side bottom

# A dot beside an icon, on the screen-edge side, for each copy of that
# app that is running, up to six -- on any workspace, with a window or
# without; beside a group's icon, its apps' copies added up. off: no
# dots.
dots on

# The main view of a dock along the bottom or the top: 17 fit.
row wide
	term files text read web irc ask
	sheet slide draw view calc clock cal
	@sound @tools @games @misc

# The main view of a dock on the left or the right: 12 fit.
row tall
	term files text read web ask
	@work @desk @sound @tools @games @net @misc

# group <id> <name, "quoted" if it has spaces> <apps...>
group work  Work     sheet slide draw view
group desk  Desk     calc clock cal
group sound Sound    play track midi
group tools Tools    settings backup info keyboard hex basic mmod pix
group games Games    casino chess kidgames chip8 space3d snake blocks bricks gpu3d mausrun planedemo
group net   Network  irc

# Anything new that the lines above do not place: an app installed
# later, say. Empty, and so not shown, while there is nothing.
group misc  "More apps"  @rest
