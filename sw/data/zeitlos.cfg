# /sys/zeitlos.cfg -- Zeitlos system configuration. See docs/config.md.
#
# One setting per line:   section.name: value
# Lines starting with # are comments. Keys are dotted. A setting that is
# absent (or commented out) uses its default. Lines this system does not
# recognise are kept -- the settings app only ever rewrites the one line
# it is changing.
#
# After editing, `cfg reload` at the serial console or Reload file in the
# settings app applies the changes; otherwise they apply at the next boot.

# What a new term window connects to by itself.
# port repl0 | port posix0 | telnet <host> | ssh <user@host> | serial [baud]
# Absent or "none": the start panel. Default: none.
#apps.term.auto_connect: port repl0

# Time zone for clock and cal. The RTC itself always counts UTC.
# A city name, which includes its daylight-saving rule -- the settings
# app lists them all -- or a fixed UTC, UTC+2, UTC-5:30 (no DST).
# Default: UTC.
#system.rtc.timezone: Berlin

# Display colour, applied at boot and on reload: white, amber, green, paper.
# Absent: the display is left as it is (white at power-on).
#system.video.mode: amber

# Desktop colour (docs/color.md): on boards with eight colour planes and
# the colour window, the desktop in four colours -- the focused window's
# frame, the dock's outline and the desktop's background tinted, in
# colours that follow the display colour above. A screen app's colour
# window takes precedence. Super+F10 switches it until the next reload.
# Defaults: yes, yes.
#system.video.desktop_colour: yes
#system.video.desktop_background: yes
# The colour theme (settings: Desktop colours < >): phosphor follows the
# display colour; slate navy plum oxblood teal graphite midnight ... are
# accent themes; nord gruvbox dracula solarized-dark solarized-light
# workbench cga bring all four colours. Or custom RGB444 colours over
# the theme: accents dark,light and base black,ink.
#system.video.desktop_theme: phosphor
#system.video.desktop_accents: 123,CA8
#system.video.desktop_base: 223,DDE

# backup (docs/backup.md): where backups go, what is backed up and what
# is left out. The defaults are shown. `backup` (or its window) makes one.
#apps.backup.to: /usb/backup
#apps.backup.from: /home /data /sys/zeitlos.cfg
#apps.backup.skip: /data/ask *.tmp
#apps.backup.keep: 10
#apps.backup.eject: no
#apps.backup.watch: /home/book     (off unless set: each save there backed up, window open)

# Where `update` gets releases, and the key they must be signed with
# (docs/distribution.md). Unset: the distribution update was built with
# (Machdyne Zeitlos). Set both to follow another distribution, or the
# URL alone for a mirror of the same one. Plain HTTP: the signature,
# not the connection, is what is trusted. key2: a second key accepted
# while a distribution changes keys.
#system.update.url: http://zeitlos.machdyne.com/release/
#system.update.key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
#system.update.key2:
