# /data/net/net.cfg -- network settings, read by `net` when it starts.
# See docs/networking.md, docs/usb_ethernet.md, docs/esp32link.md, docs/nfs.md.
#
# One setting per line:   key=value
# Lines starting with # are comments. Every line here is commented out,
# so this file as shipped changes nothing: with no settings, net uses
# DHCP on whichever network hardware the board has. Uncomment what you
# need; the settings apply at the next boot.
#
# An update never replaces this file once you have edited it.

# Which network hardware: auto (the default), usb (a USB ethernet
# adapter, even on a board with a MAC built in) or builtin.
#phy=auto

# Addresses. Without dhcp=0, net asks a DHCP server for them.
# All four are dotted quads.
#dhcp=0
#ip=192.168.1.50
#mask=255.255.255.0
#gw=192.168.1.1
#dns=192.168.1.1

# WiFi, for the Kabellos (ESP32) module: up to 4 networks, tried in
# order, each ssid followed by its psk. The module is a router with its
# own inside network, so it also needs the static addresses below
# instead of DHCP (docs/esp32link.md, "Addresses").
#ssid=MyNetwork
#psk=secret
#dhcp=0
#ip=192.168.4.2
#mask=255.255.255.0
#gw=192.168.4.1
#dns=8.8.8.8

# An NFS export to mount read-only at /nfs once the network is up, an
# address and an export path (docs/nfs.md).
#nfs=192.168.1.100:/srv/nfs/zeitlos
