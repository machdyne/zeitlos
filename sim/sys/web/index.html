<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitlos</title>
<style>
	:root { --bg: #101010; --fg: #e8e8e8; --dim: #8a8a8a; --line: #333; }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
	main { max-width: 1312px; margin: 0 auto; padding: 16px; }
	h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
	p { margin: 0 0 12px; color: var(--dim); }
	#screen { display: block; width: 100%; max-width: 1280px; aspect-ratio: 4 / 3; background: #000;
		image-rendering: pixelated; cursor: none; outline: 1px solid var(--line);
		touch-action: none; transform-origin: 0 0; }
	#frame { max-width: 1280px; overflow: hidden; }
	#screen:focus { outline-color: var(--dim); }
	#screen:fullscreen { width: 100vw; height: 100vh; max-width: none; object-fit: contain; outline: none; background: #000; }
	.bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 8px 0; color: var(--dim); }
	button { font: inherit; color: var(--fg); background: #1c1c1c; border: 1px solid var(--line); padding: 2px 10px; }
	label { cursor: pointer; }
	details { margin-top: 8px; }
	#console { height: 220px; overflow: auto; margin: 8px 0; padding: 8px; background: #000; border: 1px solid var(--line);
		white-space: pre-wrap; font-size: 12px; }
	#type { width: 100%; font: inherit; color: var(--fg); background: #000; border: 1px solid var(--line); padding: 4px 8px; }
</style>
</head>
<body>
<main>
	<h1>Zeitlos</h1>
	<p>The real system -- BIOS, kernel and apps from a release -- on an emulated Lakritz, in this page.
	Click the screen to give it the keyboard. On a touch screen: tap, drag, hold for the right button,
	two fingers to scroll, pinch to zoom.</p>
	<div id="frame"><canvas id="screen" width="640" height="480" tabindex="0"></canvas></div>
	<div class="bar">
		<span id="status">starting ...</span>
		<span id="speed"></span>
		<button id="full" type="button">full screen</button>
		<label><input type="checkbox" id="sound" checked> sound</label>
		<label><input type="checkbox" id="keep"> keep this machine's changes in this browser</label>
		<button id="forget" type="button">forget them</button>
	</div>
	<details>
		<summary>The console (UART0, the kernel's shell)</summary>
		<pre id="console"></pre>
		<input id="type" placeholder="a line for the kernel's shell, then Enter" autocomplete="off">
	</details>
</main>
<script src="zsys.js"></script>
<script src="zsys-page.js"></script>
</body>
</html>
